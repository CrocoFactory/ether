site_name: Ether
site_description: The python package for interacting with Ethereum.
site_url: https://ether.crocofactory.dev
use_directory_urls: false


theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: blue
      accent: deep purple
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: blue
      accent: deep purple
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  logo: img/logo.svg
  favicon: img/favicon.png
  language: en

extra:
  analytics:
    provider: google
    property: G-H460ESFZW8
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback!
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CrocoFactory/ether
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/CrocoFactory
    - icon: fontawesome/solid/globe
      link: https://crocofactory.dev

repo_name: CrocoFactory/ether
repo_url: https://github.com/CrocoFactory/ether

nav:
  - Ether: index.md
  - Reference:
    - reference/index.md
    - reference/async_wallet.md
    - reference/extras.md
    - reference/types.md
    - reference/wallet.md
  - Ether People: people.md

plugins:
  social:
  mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          show_root_heading: true
          show_if_no_docstring: true
          preload_modules:
            - web3
          inherited_members: true
          members_order: source
          separate_signature: true
          filters:
            - "!^_.*$"  # Exclude any attributes or methods starting with "_"
          docstring_section_style: spacy
          merge_init_into_class: true
          signature_crossrefs: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_private_members: false

markdown_extensions:
  admonition:
  abbr:
  attr_list:
  footnotes:
  md_in_html:
  tables:
  toc:
    permalink: true

  pymdownx.betterem:
    smart_enable: all
  pymdownx.caret:
  pymdownx.highlight:
    line_spans: __span
  pymdownx.inlinehilite:
  pymdownx.keys:
  pymdownx.mark:

  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.tilde:

  pymdownx.tabbed:
    alternate_style: true

  pymdownx.details:
  pymdownx.blocks.admonition:
    types:
      - note
      - attention
      - caution
      - danger
      - error
      - tip
      - hint
      - warning
      - info
      - check
  pymdownx.blocks.details:
  pymdownx.blocks.tab:
    alternate_style: True

  mdx_include:
  markdown_include_variants:

extra_css:
  - css/style.css

extra_javascript:
  - js/script.js
